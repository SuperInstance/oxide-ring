[package]
name = "oxide-ring"
version = "0.1.0"
edition = "2021"
description = "Ring buffer for GPU event logging with ternary overflow state. {+1=normal, 0=near_full, -1=overflowed}. Lossless until overflow, then oldest dropped."
license = "Apache-2.0"
repository = "https://github.com/SuperInstance/oxide-ring"
